# Parser decisions applied to this work (locked in session on 2026-04-21):
ingest:
  scope: "books_only"              # skip Prefatory Material / Title Page
  skip_chapter_arguments: true     # skip ARGUMENT div2s and introHead/intro paragraphs
  footnote_strategy: "strip"       # drop <note> contents from chunk text
  page_mode: "ccel_span"           # CCEL web-edition page markers (NOT print pages); track ccel_page_start + ccel_page_end per chunk for deep-linking to ccel.org/ccel/calvin/institutes/Page_N.html
  chunk_target_words: 600
  chunk_boundary: "section"        # target ~600 words, flush at next §-boundary when over target
  chunk_hard_boundary: "chapter"   # never cross a chapter

notes: |
  Section numbers (§1, §2, ...) are not tagged in the ThML — they appear as
  leading "1. ", "2. " in paragraph text. Parser extracts via regex.

  Page numbers (<pb n="...">) are CCEL web-edition markers, NOT print pages.
  Beveridge's print edition tops out around 1,500 pages; CCEL's go to ~2,690.
  These numbers map 1:1 to CCEL's HTML URLs (Page_N.html). They are valid
  for deep-linking back to the source but must NOT be rendered as print
  pages in citations.

  Canonical citation for Calvin is Book.Chapter.Section (e.g., III.xiii.3),
  edition-independent. The UI should render citations using locator; the
  ccel_page fields are a separate "View on CCEL" deep-link.
