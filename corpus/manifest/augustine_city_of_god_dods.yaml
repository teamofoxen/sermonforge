# Corpus manifest — one work per file.
# Checked into the repo as a provenance record. The raw source itself lives
# outside the repo (see raw_path) and is reconstructible from source_url +
# content_sha256.

id: augustine_city_of_god_dods_1890
author: "Augustine of Hippo"
author_dates: "354-430"
work: "The City of God"
work_short: "City of God"
translator: "Marcus Dods"
translator_dates: "1834-1909"
edition: "Dods translation, from Nicene and Post-Nicene Fathers, Series I, Vol. II (New York: Christian Literature Publishing Co., 1890), ed. Philip Schaff. CCEL electronic edition."
language: en
source_url: "https://ccel.org/ccel/s/schaff/npnf102.xml"
source_type: "ccel_thml"
license: "public-domain-pre-1928"
retrieved_at: "2026-04-21"
corpus_version: "2026.04"
raw_path: "corpus/raw/augustine_city_of_god_dods_1890/city_of_god.xml"
