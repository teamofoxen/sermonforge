name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node policy (Session 5, amended 2026-07-14): the app's runtime is
          # Electron's own Node; tooling supports Node >=20 (package.json
          # engines). CI pins the 24 LTS line — the same npm major (11) as the
          # machine that writes package-lock.json. npm 10 (bundled with Node
          # 20) builds a DIFFERENT ideal tree from the same lock (it insists on
          # materializing vitest→vite's optional esbuild peer) and fails
          # `npm ci` outright — the 2026-07-13/14 red runs. If the npm that
          # generates the lock ever changes, move this pin with it.
          node-version: 24
          cache: "npm"

      - name: Install dependencies (immutable)
        # npm ci, never npm install: CI must FAIL on package.json/lock drift,
        # not silently heal it by regenerating the lock (Session 5, Part A).
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Spine integrity
        run: npm run spine-integrity
