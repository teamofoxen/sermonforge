name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Sync package.json version from tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Setting package.json version to $TAG_VERSION"
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm install

      - name: Write build-time .env
        shell: bash
        run: |
          echo "GITHUB_FEEDBACK_TOKEN=${{ secrets.FEEDBACK_TOKEN }}" > .env

      - name: Build Vite
        run: npx vite build

      - name: Build and publish Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx electron-builder --win
          --publish always
          --config.directories.output=release

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Sync package.json version from tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Setting package.json version to $TAG_VERSION"
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm install

      - name: Write build-time .env
        run: |
          echo "GITHUB_FEEDBACK_TOKEN=${{ secrets.FEEDBACK_TOKEN }}" > .env

      - name: Generate macOS .icns from designer iconset
        run: |
          iconutil -c icns brand/icons/sermonforge.iconset -o build/icon.icns
          ls -lh build/icon.icns

      - name: Build Vite
        run: npx vite build

      - name: Build and publish macOS DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >
          npx electron-builder --mac
          --publish always
          --config.directories.output=release
