name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  # ── Release gates (Session 5) ───────────────────────────────────────────────
  # The EXACT TAGGED COMMIT must pass every gate before either platform build
  # runs — publishing is impossible without them (both build jobs `needs` this
  # job). Gates: immutable install, full test suite, lint, spine integrity,
  # the production-SQLite integration + migration/recovery suites (run
  # explicitly so a release log shows them by name), and the Vite production
  # build.
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 24 LTS — must match the npm major that writes package-lock.json
          # (see the Node-policy note in test.yml; npm 10 rejects the npm-11 lock).
          node-version: 24
          cache: "npm"

      - name: Install dependencies (immutable)
        run: npm ci

      - name: Full test suite
        run: npm test

      - name: Production-SQLite integration + migration/recovery matrix
        run: npx vitest run tests/persistence/

      - name: Lint
        run: npm run lint

      - name: Spine integrity
        run: npm run spine-integrity

      - name: Vite production build
        run: npx vite build

  build-windows:
    runs-on: windows-latest
    needs: gates

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 24 LTS — must match the npm major that writes package-lock.json
          # (see the Node-policy note in test.yml; npm 10 rejects the npm-11 lock).
          node-version: 24
          cache: "npm"

      - name: Stamp version + release channel from tag
        shell: bash
        # sfReleaseChannel marks this as a CI-published build — the ONLY kind
        # allowed to auto-update. Local builds (npm run build) carry no stamp,
        # so electron/updater.js stays inert in them; without this, the
        # published release outranks the 1.0.0 dev pin and silently replaces
        # any local build under test.
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Setting package.json version to $TAG_VERSION"
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version
          npm pkg set sfReleaseChannel=stable

      - name: Install dependencies (immutable)
        run: npm ci

      - name: Build Vite
        run: npx vite build

      - name: Package Windows installer (no publish yet)
        run: >
          npx electron-builder --win
          --publish never
          --config.directories.output=release

      - name: Packaged smoke — launch, schema, preload, render, clean exit
        # The bounded packaged smoke (scripts/packaged-smoke.cjs + the
        # SF_SMOKE hook in electron/main.js): the actual unpacked app must
        # launch, initialize/migrate its schema, load the preload bridge,
        # render the primary window, and exit cleanly — or the release stops
        # here, before anything publishes.
        run: node scripts/packaged-smoke.cjs release/win-unpacked

      - name: Publish Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx electron-builder --win
          --publish always
          --config.directories.output=release

  build-macos:
    runs-on: macos-latest
    needs: gates

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 24 LTS — must match the npm major that writes package-lock.json
          # (see the Node-policy note in test.yml; npm 10 rejects the npm-11 lock).
          node-version: 24
          cache: "npm"

      - name: Stamp version + release channel from tag
        # Same stamp as build-windows — see the comment there.
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Setting package.json version to $TAG_VERSION"
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version
          npm pkg set sfReleaseChannel=stable

      - name: Install dependencies (immutable)
        run: npm ci

      - name: Generate macOS .icns from designer iconset
        run: |
          iconutil -c icns brand/icons/sermonforge.iconset -o build/icon.icns
          ls -lh build/icon.icns

      - name: Build Vite
        run: npx vite build

      - name: Diagnose .p12 + password before signing
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          echo "=== Password length (should be 32) ==="
          echo "${#CSC_KEY_PASSWORD}"
          echo "=== Password char categories (no value exposed) ==="
          printf '%s' "$CSC_KEY_PASSWORD" | awk '{ for(i=1;i<=length($0);i++) { c=substr($0,i,1); if(c~/[A-Fa-f0-9]/) hex++; else other++; } print "hex chars:", hex+0, "non-hex chars:", other+0 }'
          echo "=== Decode .p12, hash it (expect 33c35cc55ca173d42d7a42f169eb035f1357bdf5ac30e714ccd646e09c182450) ==="
          printf '%s' "$CSC_LINK" | base64 -d > /tmp/diagnose.p12
          shasum -a 256 /tmp/diagnose.p12
          echo "=== OpenSSL test: does the password decrypt the .p12? ==="
          if openssl pkcs12 -in /tmp/diagnose.p12 -nokeys -passin "pass:$CSC_KEY_PASSWORD" -info -nomacver 2>&1 | grep -q "Bag Attributes"; then
            echo "OpenSSL: opened .p12 (no MAC verify)"
          else
            echo "OpenSSL: FAILED to open .p12 even without MAC verify — file is corrupt"
          fi
          echo "=== OpenSSL with MAC verify (real test) ==="
          openssl pkcs12 -in /tmp/diagnose.p12 -nokeys -passin "pass:$CSC_KEY_PASSWORD" -info 2>&1 | grep -E "MAC|verify|Bag|error" | head -5
          rm -f /tmp/diagnose.p12

      - name: Decode App Store Connect API key (.p8) to file
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -d > ~/private_keys/AuthKey.p8
          ls -la ~/private_keys/AuthKey.p8
          head -1 ~/private_keys/AuthKey.p8
          echo "APPLE_API_KEY=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build and publish macOS DMG
        timeout-minutes: 30
        env:
          # Hard links are the mechanism behind the v1.0.0–v1.2.0 Intel-half
          # corruption: electron-builder links node_modules files into the
          # packaged x64 half, then the arm64 rebuild truncate-writes
          # better_sqlite3.node in place (same filename both arches) and
          # silently rewrites the file inside the already-packaged x64 app.
          # Real copies make the halves independent. The afterPack arch gate
          # (scripts/mac-arch-gate.cjs) then proves both halves before signing.
          USE_HARD_LINKS: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          DEBUG: electron-builder,electron-notarize*,electron-osx-sign*
        run: >
          npx electron-builder --mac
          --publish always
          --config.directories.output=release

      - name: Diagnostic — direct notarytool submit (only on failure)
        if: failure() || cancelled()
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set +e
          mkdir -p diagnostic
          APP_PATH=$(find release -type d -name "SermonForge.app" -maxdepth 4 2>/dev/null | head -1)
          {
            echo "=== Diagnostic context ==="
            date -u
            echo "APP_PATH: $APP_PATH"
            echo "APPLE_API_KEY: $APPLE_API_KEY"
            ls -la "$APPLE_API_KEY" 2>&1
          } | tee diagnostic/notarytool-direct.log
          if [ -z "$APP_PATH" ]; then
            echo "No .app found — electron-builder failed before signing produced a bundle" >> diagnostic/notarytool-direct.log
            exit 0
          fi
          {
            echo "=== Codesign verification ==="
            codesign --verify --deep --strict --verbose=4 "$APP_PATH" 2>&1
            echo "=== Zipping .app for notarization ==="
            ditto -c -k --keepParent "$APP_PATH" diagnostic/SermonForge-direct.zip 2>&1
            ls -lh diagnostic/SermonForge-direct.zip
            echo "=== xcrun notarytool submit (verbose, raw output) ==="
            xcrun notarytool submit diagnostic/SermonForge-direct.zip \
              --key "$APPLE_API_KEY" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait \
              --verbose \
              --timeout 25m 2>&1
            NT_EXIT=$?
            echo "=== notarytool exit code: $NT_EXIT ==="
            SUB_ID=$(grep -oE "id: [a-f0-9-]{36}" diagnostic/notarytool-direct.log | head -1 | awk '{print $2}')
            if [ -n "$SUB_ID" ]; then
              echo "=== notarytool log $SUB_ID ==="
              xcrun notarytool log "$SUB_ID" \
                --key "$APPLE_API_KEY" \
                --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER" 2>&1
            else
              echo "Could not extract submission ID from log."
            fi
          } | tee -a diagnostic/notarytool-direct.log

      - name: Diagnostic — upload raw notarytool log
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: notarytool-diagnostic
          path: diagnostic/
          retention-days: 7
