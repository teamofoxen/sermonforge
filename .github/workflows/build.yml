name: Build and Release (Windows)

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Sync package.json version from tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Setting package.json version to $TAG_VERSION"
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm install

      - name: Write build-time .env
        shell: bash
        run: |
          echo "GITHUB_FEEDBACK_TOKEN=${{ secrets.FEEDBACK_TOKEN }}" > .env

      - name: Build Vite
        run: npx vite build

      - name: Build and publish Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx electron-builder --win
          --publish always
          --config.directories.output=release
