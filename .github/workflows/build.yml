name: Build and Release

on:
  push:
    tags:
      - "v*"
  # Validation mode. Runs the whole pipeline — gates, packaging, smoke, the
  # arch gate, manifest derivation — WITHOUT publishing anything, so the
  # release machinery can be exercised without burning a production tag.
  # Publishing is not merely "skipped" here: every publish step and the
  # public-release flip are guarded on the ref being a tag, so a dispatch
  # run has no path to creating or mutating a release.
  workflow_dispatch:

jobs:
  # ── Release gates (Session 5) ───────────────────────────────────────────────
  # The EXACT TAGGED COMMIT must pass every gate before either platform build
  # runs — publishing is impossible without them (both build jobs `needs` this
  # job). Gates: immutable install, full test suite, lint, spine integrity,
  # the production-SQLite integration + migration/recovery suites (run
  # explicitly so a release log shows them by name), and the Vite production
  # build.
  gates:
    runs-on: ubuntu-latest
    outputs:
      # Consumed by both platform jobs' publish steps. Removing `needs: gates`
      # makes this expression unresolvable, so publishing BREAKS rather than
      # silently racing ahead of a red gate (2026-07-20 audit, M12: the old
      # `needs:` assertion ran inside the gates job itself and test.yml never
      # fires on tags, so nothing outside the gate protected the gate).
      release_ok: ${{ steps.gate_stamp.outputs.release_ok }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Node 24 — must match the npm major that writes package-lock.json
          # (npm 10 rejects the npm-11 lock). package.json engines.node and
          # README state the same line; release-pipeline.test.ts asserts all
          # four pins agree.
          node-version: 24
          cache: "npm"

      - name: Only a stable vX.Y.Z tag may become a release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        # `on: push: tags: v*` matches release candidates too, and this repo
        # really does push them (v1.0.0-mac.rc.1 … rc.13). Combined with a
        # non-draft, non-prerelease publish, any one of them would capture
        # the `releases/latest` alias and auto-ship to every install.
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' is not a stable release tag (expected vX.Y.Z). Refusing to build a publishable release."
            exit 1
          fi
          echo "Stable release tag: $TAG"

      - name: Install dependencies (immutable)
        run: npm ci

      - name: Full test suite
        run: npm test

      - name: Production-SQLite integration + migration/recovery matrix
        run: npx vitest run tests/persistence/

      - name: Lint
        run: npm run lint

      - name: Spine integrity
        run: npm run spine-integrity

      - name: Vite production build
        run: npx vite build

      - name: Mark gates passed
        id: gate_stamp
        run: echo "release_ok=true" >> "$GITHUB_OUTPUT"

  build-windows:
    runs-on: windows-latest
    needs: gates

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Stamp version + release channel from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        # sfReleaseChannel marks this as a CI-published build — the ONLY kind
        # allowed to auto-update. Local builds (npm run build) carry no stamp,
        # so electron/updater.js stays inert in them; without this, the
        # published release outranks the 1.0.0 dev pin and silently replaces
        # any local build under test. A validation (workflow_dispatch) run
        # deliberately skips this, so nothing it produces can ever update.
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Setting package.json version to $TAG_VERSION"
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version
          npm pkg set sfReleaseChannel=stable

      - name: Install dependencies (immutable)
        run: npm ci

      - name: Build Vite
        run: npx vite build

      - name: Package Windows installer (no publish yet)
        run: >
          npx electron-builder --win
          --publish never
          --config.directories.output=release

      - name: Packaged smoke — launch, schema, preload, render, clean exit
        # The bounded packaged smoke (scripts/packaged-smoke.cjs + the
        # SF_SMOKE hook in electron/main.js): the actual unpacked app must
        # launch, initialize/migrate its schema, load the preload bridge,
        # render real application DOM, and exit cleanly — or the release
        # stops here, before anything publishes.
        run: node scripts/packaged-smoke.cjs release/win-unpacked

      - name: Publish Windows installer (from the SMOKED build)
        if: startsWith(github.ref, 'refs/tags/v') && needs.gates.outputs.release_ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --prepackaged points electron-builder at the EXACT directory the
        # smoke just exercised, instead of repacking from scratch. The old
        # second full `electron-builder --win` re-fetched prebuilt natives and
        # rebuilt the installer AFTER the smoke passed, so the published bytes
        # were never provably the smoked bytes (2026-07-20 audit, M7).
        run: >
          npx electron-builder --win
          --prepackaged release/win-unpacked
          --publish always
          --config.directories.output=release

  build-macos:
    runs-on: macos-latest   # arm64 (see actions/runner-images); Intel is macos-15-intel
    needs: gates
    # Signing, notarization and publishing only ever apply to a real tag. A
    # validation run exercises macOS through smoke-macos instead, which
    # packages and LAUNCHES the app without any credential.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Stamp version + release channel from tag
        # Same stamp as build-windows — see the comment there.
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Setting package.json version to $TAG_VERSION"
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version
          npm pkg set sfReleaseChannel=stable

      - name: Install dependencies (immutable)
        run: npm ci

      - name: Generate macOS .icns from designer iconset
        run: |
          iconutil -c icns brand/icons/sermonforge.iconset -o build/icon.icns
          ls -lh build/icon.icns

      - name: Build Vite
        run: npx vite build

      - name: Diagnose .p12 + password before signing
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          echo "=== Password length (should be 32) ==="
          echo "${#CSC_KEY_PASSWORD}"
          echo "=== Password char categories (no value exposed) ==="
          printf '%s' "$CSC_KEY_PASSWORD" | awk '{ for(i=1;i<=length($0);i++) { c=substr($0,i,1); if(c~/[A-Fa-f0-9]/) hex++; else other++; } print "hex chars:", hex+0, "non-hex chars:", other+0 }'
          echo "=== Decode .p12, hash it (expect 33c35cc55ca173d42d7a42f169eb035f1357bdf5ac30e714ccd646e09c182450) ==="
          printf '%s' "$CSC_LINK" | base64 -d > /tmp/diagnose.p12
          shasum -a 256 /tmp/diagnose.p12
          echo "=== OpenSSL test: does the password decrypt the .p12? ==="
          if openssl pkcs12 -in /tmp/diagnose.p12 -nokeys -passin "pass:$CSC_KEY_PASSWORD" -info -nomacver 2>&1 | grep -q "Bag Attributes"; then
            echo "OpenSSL: opened .p12 (no MAC verify)"
          else
            echo "OpenSSL: FAILED to open .p12 even without MAC verify â€” file is corrupt"
          fi
          echo "=== OpenSSL with MAC verify (real test) ==="
          openssl pkcs12 -in /tmp/diagnose.p12 -nokeys -passin "pass:$CSC_KEY_PASSWORD" -info 2>&1 | grep -E "MAC|verify|Bag|error" | head -5
          rm -f /tmp/diagnose.p12

      - name: Decode App Store Connect API key (.p8) to file
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -d > ~/private_keys/AuthKey.p8
          ls -la ~/private_keys/AuthKey.p8
          echo "APPLE_API_KEY=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      # ── Release build: signed, notarized, published to the DRAFT ──────────
      - name: Build and publish macOS DMG + updater ZIP
        if: needs.gates.outputs.release_ok == 'true'
        timeout-minutes: 45
        env:
          # Hard links are the mechanism behind the v1.0.0–v1.2.0 Intel-half
          # corruption: electron-builder links node_modules files into the
          # packaged x64 half, then the arm64 rebuild truncate-writes
          # better_sqlite3.node in place (same filename both arches) and
          # silently rewrites the file inside the already-packaged x64 app.
          # Real copies make the halves independent. The afterPack arch gate
          # (scripts/mac-arch-gate.cjs) then proves both halves before signing.
          USE_HARD_LINKS: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          DEBUG: electron-builder,electron-notarize*,electron-osx-sign*
        run: |
          set -o pipefail
          npx electron-builder --mac \
            --publish always \
            --config.directories.output=release 2>&1 | tee mac-build.log

      - name: Require the architecture gate to have actually run and PASSED
        shell: bash
        # The gate is an afterPack hook: it legitimately no-ops on the
        # per-arch temp packs and asserts only on the assembled universal
        # app. That means "no failure" is NOT evidence it ran — if the
        # universal split ever stops being produced (mergeASARs flipped,
        # arch changed) the gate silently skips forever and the exact
        # defect class that shipped boot-crashing Intel DMGs for three
        # releases becomes reachable again with CI fully green.
        # Requiring the PASS marker turns that silence into a red build.
        run: |
          if ! grep -q '\[mac-arch-gate\] PASS' mac-build.log; then
            echo "::error::The macOS architecture gate never reported PASS. Either it did not run on the assembled universal app, or the universal split was not produced. Refusing to ship an unverified macOS build."
            grep -n 'mac-arch-gate' mac-build.log || echo "(no mac-arch-gate output at all)"
            exit 1
          fi
          echo "Architecture gate PASSED on the assembled universal app:"
          grep -n '\[mac-arch-gate\]' mac-build.log

      - name: Diagnostic — direct notarytool submit (only on failure)
        if: failure() || cancelled()
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set +e
          mkdir -p diagnostic
          APP_PATH=$(find release -type d -name "SermonForge.app" -maxdepth 4 2>/dev/null | head -1)
          {
            echo "=== Diagnostic context ==="
            date -u
            echo "APP_PATH: $APP_PATH"
            echo "APPLE_API_KEY: $APPLE_API_KEY"
            ls -la "$APPLE_API_KEY" 2>&1
          } > diagnostic/notarytool-direct.log
          if [ -z "$APP_PATH" ]; then
            echo "No .app found — electron-builder failed before signing produced a bundle" >> diagnostic/notarytool-direct.log
            exit 0
          fi
          {
            echo "=== Codesign verification ==="
            codesign --verify --deep --strict --verbose=4 "$APP_PATH" 2>&1
            echo "=== Zipping .app for notarization ==="
            ditto -c -k --keepParent "$APP_PATH" diagnostic/SermonForge-direct.zip 2>&1
            ls -lh diagnostic/SermonForge-direct.zip
            echo "=== xcrun notarytool submit (verbose, raw output) ==="
            xcrun notarytool submit diagnostic/SermonForge-direct.zip \
              --key "$APPLE_API_KEY" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait \
              --verbose \
              --timeout 25m 2>&1
            echo "=== notarytool exit code: $? ==="
          } >> diagnostic/notarytool-direct.log 2>&1
          # Read the submission ID back from the COMPLETED log, not from a
          # file still being streamed into (the old `tee -a` + grep read a
          # log it was concurrently writing).
          SUB_ID=$(grep -oE "id: [a-f0-9-]{36}" diagnostic/notarytool-direct.log | head -1 | awk '{print $2}')
          if [ -n "$SUB_ID" ]; then
            echo "=== notarytool log $SUB_ID ===" >> diagnostic/notarytool-direct.log
            xcrun notarytool log "$SUB_ID" \
              --key "$APPLE_API_KEY" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" >> diagnostic/notarytool-direct.log 2>&1
          else
            echo "Could not extract submission ID from log." >> diagnostic/notarytool-direct.log
          fi
          cat diagnostic/notarytool-direct.log

      - name: Diagnostic — upload raw notarytool log
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: notarytool-diagnostic
          path: diagnostic/
          retention-days: 7

  # ── macOS runtime validation ────────────────────────────────────────────────
  # The architecture gate is a STATIC Mach-O header check. It proves the bytes
  # are the right shape; it cannot prove the app starts. That gap is not
  # theoretical: v1.0.0 through v1.2.0 shipped signed, notarized DMGs that
  # crashed at launch on every Intel Mac, and the defect was found by a field
  # report 74 days later because nothing in the pipeline had ever RUN the
  # macOS build.
  #
  # So: package the real universal app on each architecture and launch it.
  # On the Intel runner macOS executes the x64 slice and loads the x64 half's
  # better_sqlite3.node — exactly the combination that was broken. Intel is
  # first here deliberately; it is the half that shipped broken.
  #
  # Unsigned and never published: this needs no credential, so it also runs on
  # workflow_dispatch. finalize-release waits on it, which means a macOS build
  # that does not start leaves the release an unpublished draft.
  smoke-macos:
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          # Labels per actions/runner-images: macos-latest is arm64, and
          # macos-15-intel is the x64 image. Do not infer the architecture
          # from an older label — macos-13 was Intel, macos-latest is not.
          - runner: macos-15-intel
            arch: x64 (Intel)
          - runner: macos-latest
            arch: arm64 (Apple Silicon)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies (immutable)
        run: npm ci

      - name: Generate macOS .icns from designer iconset
        run: iconutil -c icns brand/icons/sermonforge.iconset -o build/icon.icns

      - name: Build Vite
        run: npx vite build

      - name: Package the universal app (unsigned, never published)
        env:
          # Same hard-link setting as the release build — this must reproduce
          # the real packaging conditions to be worth anything.
          USE_HARD_LINKS: "false"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -o pipefail
          npx electron-builder --mac             --publish never             --config.mac.notarize=false             --config.mac.target=dir             --config.directories.output=release 2>&1 | tee mac-build.log

      - name: Require the architecture gate to have actually run and PASSED
        run: |
          if ! grep -q '\[mac-arch-gate\] PASS' mac-build.log; then
            echo "::error::The macOS architecture gate never reported PASS on ${{ matrix.arch }}."
            grep -n 'mac-arch-gate' mac-build.log || echo "(no mac-arch-gate output at all)"
            exit 1
          fi
          grep -n '\[mac-arch-gate\]' mac-build.log

      - name: Launch the packaged app on ${{ matrix.arch }}
        # The same bounded smoke the Windows job runs: the app must start,
        # initialize its schema through better_sqlite3, load the preload
        # bridge, render real application DOM, and exit cleanly.
        run: |
          APP_DIR=$(find release -maxdepth 2 -type d -name "*.app" | head -1 | xargs dirname)
          echo "Launching from $APP_DIR on $(uname -m)"
          node scripts/packaged-smoke.cjs "$APP_DIR"

  # ── Release finalization ────────────────────────────────────────────────────
  # Both platforms publish into a DRAFT release (package.json
  # build.publish.releaseType = "draft"). Nothing is public until this job
  # proves the release is complete and flips it.
  #
  # This closes three defects at once:
  #   • H2 — the release used to go public the moment the FIRST platform
  #     uploaded, so every release had a window where the website's
  #     hardcoded Mac download 404'd (v1.2.0: ~27 hours).
  #   • H1 — nothing verified the release actually carried its artifacts.
  #   • The >2h publisher skip — electron-builder refuses to touch a
  #     PUBLISHED release older than two hours, logs "skipped publishing"
  #     and exits SUCCESS. Drafts always accept uploads, so a re-run the
  #     next day works instead of silently uploading nothing.
  finalize-release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, smoke-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies (immutable)
        run: npm ci

      - name: Verify the release is complete before anyone can download it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Derives the expected artifact set from the packaging contract and
        # checks every one against the real release: presence, non-zero size,
        # feed/tag version agreement, feed→asset size agreement, real sha512
        # of the downloaded bytes, the macOS ZIP updater payload, and the
        # filenames the website hardcodes. Fails closed.
        run: node scripts/release-manifest.cjs --tag "${GITHUB_REF_NAME}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The ONLY transition from private to public in the entire pipeline.
        run: |
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
          echo "Published ${GITHUB_REF_NAME}"

      - name: Confirm the public release actually serves its downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A release can be marked public and still not resolve through the
        # `releases/latest` alias the website links to. Check the real URLs.
        run: |
          set -euo pipefail
          for asset in SermonForge-Setup.exe SermonForge-Setup.dmg SermonForge-Setup.zip latest.yml latest-mac.yml; do
            url="https://github.com/teamofoxen/sermonforge/releases/latest/download/$asset"
            code=$(curl -sSL -o /dev/null -w '%{http_code}' "$url")
            if [ "$code" != "200" ]; then
              echo "::error::$url returned HTTP $code — the public release does not serve this asset."
              exit 1
            fi
            echo "OK  $asset ($code)"
          done
