name = "sermonforge-bti"
main = "worker.js"
compatibility_date = "2026-05-08"

# D1 database binding.
# database_id is filled in after `wrangler d1 create sermonforge-bti`.
[[d1_databases]]
binding = "DB"
database_name = "sermonforge-bti"
database_id = "7cd9f545-3d00-451c-8e6f-19eadba81173"

# Secrets (set via `wrangler secret put`, not in this file):
#   ADMIN_TOKEN  — query token the inbox UI uses for GET /inbox
#
# /ingest is intentionally unauthenticated (see worker.js): a bearer token
# shipped in every desktop client is readable by every user and provided no real
# security. The old INGEST_TOKEN secret is no longer read; abuse is bounded by
# payload-shape validation, size caps, and a Cloudflare edge rate-limit rule on
# the /ingest route (configure in the Cloudflare dashboard: Security → WAF →
# Rate limiting rules).
