<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SermonForge</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #f7f3ec;
      color: #1a1410;
      font-family: 'IBM Plex Serif', Georgia, serif;
      overflow: hidden;
    }
    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }
    .wordmark {
      font-family: 'IBM Plex Serif', Georgia, serif;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: #1a1410;
    }
    .sub {
      font-size: 13px;
      color: #6b5d50;
    }
    .spinner {
      width: 22px;
      height: 22px;
      border: 2px solid rgba(26, 20, 16, 0.15);
      border-top-color: #1a1410;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-top: 6px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="wordmark">SermonForge</div>
    <div class="sub">Loading library…</div>
    <div class="spinner" aria-hidden="true"></div>
  </div>
</body>
</html>
